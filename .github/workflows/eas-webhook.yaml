name: EAS Build Complete Receiver

on:
  repository_dispatch:
    types:
      - eas-build

jobs:
  upload-artifact:
    name: Attach EAS Artifact To Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event.client_payload.status == 'finished' &&
      github.event.client_payload.artifacts.applicationArchiveUrl != ''

    outputs:
      downloaded_file: ${{ steps.download.outputs.file }}

    steps:
      - name: 📥 Download Build Artifact
        id: download
        shell: bash
        run: |
          PLATFORM="${{ github.event.client_payload.platform }}"
          DOWNLOAD_URL="${{ github.event.client_payload.artifacts.applicationArchiveUrl }}"

          echo "Platform: $PLATFORM"

          if [ "$PLATFORM" = "android" ]; then
            FILENAME="ArtLens-android"
            if [[ "$DOWNLOAD_URL" == *.apk* ]]; then
              FILENAME="${FILENAME}.apk"
            elif [[ "$DOWNLOAD_URL" == *.aab* ]]; then
              FILENAME="${FILENAME}.aab"
            else
              FILENAME="${FILENAME}.bin"
            fi
          elif [ "$PLATFORM" = "ios" ]; then
            FILENAME="ArtLens-ios.ipa"
          else
            echo "Unknown platform: $PLATFORM"
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$DOWNLOAD_URL" \
            --output "$FILENAME"

          echo "file=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: 📤 Attach Artifact To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.metadata.githubTagName }}
          files: ${{ steps.download.outputs.file }}
          append_body: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
