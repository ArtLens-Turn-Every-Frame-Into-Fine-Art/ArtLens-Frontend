name: EAS Build Complete Receiver

on:
  repository_dispatch:
    types:
      - eas-build

jobs:
  upload-artifact:
    name: Attach EAS Artifact To Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event.client_payload.status == 'finished' &&
      github.event.client_payload.artifacts.applicationArchiveUrl != ''

    steps:
      - name: 🏷 Extract Tag From Build Message
        id: get-tag
        env:
          BUILD_MSG: ${{ github.event.client_payload.message }}
        run: |
          TAG=$(echo "$BUILD_MSG" | grep -oE '\[tag:v[0-9]+\]' | sed 's/\[tag://;s/\]//' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "Error: Could not extract version tag from EAS message."
            exit 1
          fi
          echo "Found Tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📥 Download Build Artifact
        id: download
        run: |
          PLATFORM="${{ github.event.client_payload.platform }}"
          DOWNLOAD_URL="${{ github.event.client_payload.artifacts.applicationArchiveUrl }}"

          case "$PLATFORM" in
            android)
              FILENAME="ArtLens-android.apk"
              [[ "$DOWNLOAD_URL" == *apk* ]] || FILENAME="ArtLens-android.aab"
              ;;
            ios)
              FILENAME="ArtLens-ios.ipa"
              ;;
            *)
              echo "Error: Unknown platform '$PLATFORM'"
              exit 1
              ;;
          esac

          curl --fail --location --silent --show-error "$DOWNLOAD_URL" --output "$FILENAME"
          echo "file=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: 📤 Attach Artifact To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          files: ${{ steps.download.outputs.file }}
          append_body: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
