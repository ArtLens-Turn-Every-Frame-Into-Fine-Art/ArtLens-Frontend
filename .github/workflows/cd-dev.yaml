name: Frontend Development CD

on:
  push:
    branches:
      - develop

jobs:
  development-update:
    name: Update Preview
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: 📚 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_PAT }}

      - name: 📦 Install dependencies
        run: npm ci

      # This OTA publish doubles as the build-health gate: if `eas update`
      # fails here, the JS bundle wouldn't ship to production either, so
      # there's no point promoting this commit to main.
      - name: ☁️ Publish OTA Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: eas update --branch development --message "$COMMIT_MSG"
