name: Frontend Development CD

on:
  push:
    branches:
      - develop

jobs:
  development-update:
    name: Update Preview
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: 📚 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_PAT }}

      - name: 📦 Install dependencies
        run: npm ci

      # SHIP OTA UPDATE (Instant update for existing users)
      - name: ☁️ Publish OTA Update
        run: eas update --branch development --message "${{ github.event.head_commit.message }}"
