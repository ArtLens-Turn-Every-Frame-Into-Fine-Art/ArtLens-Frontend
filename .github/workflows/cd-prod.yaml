name: Frontend Production CD

on:
  push:
    branches:
      - main

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  check_fingerprint:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      fingerprint_changed: ${{ steps.fingerprint.outputs.fingerprint_changed }}
      fingerprint_hash: ${{ steps.fingerprint.outputs.fingerprint_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Necessary to compare with the previous commit

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_PAT }}

      - name: 🔍 Check Fingerprint
        id: fingerprint
        # This compares the current state against the last successful build fingerprint
        run: |
          npm ci

          # 1. Generate fingerprint for the CURRENT commit
          eas fingerprint:generate --platform android --json > current-fingerprint.json

          # 2. Temporarily switch to the PREVIOUS commit to grab its blueprint
          git checkout HEAD~1
          npm ci --legacy-peer-deps || npm ci
          eas fingerprint:generate --platform android --json > previous-fingerprint.json

          # 3. Return to the original commit
          git checkout -

          # 4. Safely compare the two JSON structural files
          eas fingerprint:compare --fingerprint1 previous-fingerprint.json --fingerprint2 current-fingerprint.json --json > diff.json || echo "[]" > diff.json

          # 5. Use jq to parse the array size (much safer than grep)
          if [ "$(jq '. | length' diff.json)" -eq 0 ]; then
            echo "fingerprint_changed=false" >> $GITHUB_OUTPUT
          else
            echo "fingerprint_changed=true" >> $GITHUB_OUTPUT
          fi

          # 6. Extract only the clean single-line hash string to avoid multi-line output breaks
          HASH=$(jq -r '.hash' current-fingerprint.json)
          echo "fingerprint_hash=$HASH" >> $GITHUB_OUTPUT

  production-ship:
    needs: check_fingerprint
    name: Update & Build Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: 📚 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_PAT }}

      - name: 📦 Install dependencies
        run: npm ci

      # 1. SHIP OTA UPDATE (Instant runtime update for matching engines)
      - name: ☁️ Publish OTA Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: eas update --branch production --message "$COMMIT_MSG"

      # 2. CREATE THE RELEASE CONTAINER (Draft mode)
      - name: 📝 Create Release Container
        if: needs.check_fingerprint.outputs.fingerprint_changed == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ArtLens Release v${{ github.run_number }}
          body: |
            ## Recent Changes
            ${{ github.event.head_commit.message }}

            **Fingerprint:** `${{ needs.check_fingerprint.outputs.fingerprint_hash }}`
          draft: true # Keep as draft until builds are attached
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. TRIGGER ASYNC BUILDS
      - name: 🤖 Trigger Android Build
        if: needs.check_fingerprint.outputs.fingerprint_changed == 'true'
        run: |
          npx eas-cli build --platform android --profile production --non-interactive --no-wait \
          --metadata '{"githubTagName":"v${{ github.run_number }}"}'

      #- name: 🍎 Trigger iOS Build (Commented)
      #  if: needs.check_fingerprint.outputs.fingerprint_changed == 'true'
      #  run: |
      #    npx eas-cli build --platform ios --profile production --non-interactive --no-wait \
      #    --metadata '{"githubTagName":"v${{ github.run_number }}"}'
