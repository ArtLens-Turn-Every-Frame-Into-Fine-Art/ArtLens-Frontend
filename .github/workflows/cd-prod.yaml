name: Frontend Production CD

on:
  push:
    branches:
      - main

permissions:
  contents: write # Required to create the GitHub Release (and its tag)

jobs:
  production-ship:
    name: OTA Update & Android Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: 📚 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_PAT }}

      - name: 📦 Install dependencies
        run: npm ci

      # Second gate: re-confirm the build is healthy by publishing OTA to
      # production. If this fails, nothing below (builds, release) runs.

      - name: ☁️ Publish OTA Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          eas update \
            --branch production \
            --message "$COMMIT_MSG"

      # softprops/action-gh-release creates the tag automatically since
      # v${{ github.run_number }} doesn't exist yet — no separate
      # "create git tag" step needed.

      - name: 📝 Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ArtLens Release v${{ github.run_number }}
          body: |
            ## Release Information

            **Commit Message**
            ${{ github.event.head_commit.message }}

            ---
            Android build is being generated by EAS Build.
            Assets will be attached automatically when the build completes.
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤖 Trigger Android Production Build
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "Release v${{ github.run_number }} [platform:android] [tag:v${{ github.run_number }}]"

      # - name: 🍎 Trigger iOS Production Build
      #   run: |
      #     eas build \
      #       --platform ios \
      #       --profile production \
      #       --non-interactive \
      #       --no-wait \
      #       --message "Release v${{ github.run_number }} [platform:ios] [tag:v${{ github.run_number }}]"
